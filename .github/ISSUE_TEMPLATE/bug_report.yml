name: Bug report
description: A crash, wrong output, or a command that does not do what the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a finding that is wrong for your site, use the **False positive** form instead.
        For security issues, use [private reporting](https://github.com/H3M4N1H/ranq/security/advisories/new), not an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error or traceback if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command, and the site or a minimal page that triggers it.
      placeholder: |
        1. ranq audit https://example.com --max-pages 20
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ranq version
      description: Output of `ranq --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options: [pipx, pip, Docker, GitHub Action, From source]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: ranq.yaml (if any)
      description: Remove anything private. API keys are never in this file.
      render: yaml
