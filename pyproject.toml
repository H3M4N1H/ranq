[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ranq"
dynamic = ["version"]
description = "Free, open-source CLI that audits and optimizes websites for SEO, AEO and GEO."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "NodeKraft" }]
maintainers = [{ name = "H3M4N1H" }]
keywords = [
  "seo", "aeo", "geo", "generative-engine-optimization", "answer-engine-optimization",
  "technical-seo", "seo-audit", "ai-search", "ai-crawlers", "llms.txt", "indexnow", "crawler",
  "structured-data", "json-ld", "core-web-vitals", "search-console", "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "selectolax>=1.0",
  "jinja2>=3.1.6",  # earlier 3.1.x releases have published CVEs
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# JavaScript rendering (--render). Then run `playwright install chromium`.
browser = ["playwright>=1.44"]
# YAKE keyword extraction alongside TF-IDF (pulls in NumPy and networkx).
keywords = ["yake>=0.4.8"]
# Local semantic clustering. Large download (PyTorch); TF-IDF clustering is used without it.
ml = ["sentence-transformers>=3.0"]
# Google Search Console API via a service account.
google = ["google-auth>=2.29"]
# Everything except the ML extra.
full = ["ranq[browser,keywords,google]"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.scripts]
ranq = "ranq.cli:app"

[project.urls]
Homepage = "https://github.com/H3M4N1H/ranq"
Repository = "https://github.com/H3M4N1H/ranq"
Issues = "https://github.com/H3M4N1H/ranq/issues"
Changelog = "https://github.com/H3M4N1H/ranq/blob/main/CHANGELOG.md"
NodeKraft = "https://nodekraft.tech"

[tool.hatch.version]
path = "src/ranq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ranq"]

[tool.hatch.build.targets.sdist]
include = ["src/ranq", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ranq"]
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["yake.*", "selectolax.*", "sentence_transformers.*", "google.*", "playwright.*"]
ignore_missing_imports = true
